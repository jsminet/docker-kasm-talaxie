x-common-talaxie-config: &common-talaxie-config
    shm_size: 1gb
    environment:
      - VNC_PW
    labels:
        - traefik.enable=true
        # http service config
        - traefik.http.services.kasm-talaxie.loadbalancer.server.scheme=https
        - traefik.http.services.kasm-talaxie.loadbalancer.server.port=$KASM_HTTP_PORT
        # http router config
        - traefik.http.routers.kasm-talaxie.rule=Host(`$TALAXIE_DNS`)
        - traefik.http.routers.kasm-talaxie.entrypoints=web
        - traefik.http.routers.kasm-talaxie.service=kasm-talaxie
    volumes:
      - talaxie_home:/home/kasm-user
      - talaxie_configuration:/opt/talaxie/configuration
    restart: unless-stopped

services:
  traefik:
    image: traefik:3.7.16
    ports:
      # Exposes port 80 for incomming web requests
      - 80:80
      # The Web UI port http://0.0.0.0:8080 (enabled by --api.insecure=true)
      - 8080:8080
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/traefik/conf/traefik.yml:/etc/traefik/traefik.yml

  kasm-talaxie-di:
    image: $TALAXIE_IMAGE:$TALAXIE_DI-$TALAXIE_VERSION
    build:
      context: app/kasm-talaxie
      args:
        TALAXIE_VERSION: $TALAXIE_VERSION
        TALAXIE_EXE: $TALAXIE_DI
        XMS: $XMS
        XMX: $XMX
    profiles:
      - di
    <<: *common-talaxie-config
    
  kasm-talaxie-esb:
    image: $TALAXIE_IMAGE:$TALAXIE_ESB-$TALAXIE_VERSION
    build:
      context: app/kasm-talaxie
      args:
        TALAXIE_VERSION: $TALAXIE_VERSION
        TALAXIE_EXE: $TALAXIE_ESB
        XMS: $XMS
        XMX: $XMX
    profiles:
      - esb
    <<: *common-talaxie-config

  kasm-talaxie-bd:
    image: $TALAXIE_IMAGE:$TALAXIE_BD-$TALAXIE_VERSION
    build:
      context: app/kasm-talaxie
      args:
        TALAXIE_VERSION: $TALAXIE_VERSION
        TALAXIE_EXE: $TALAXIE_BD
        XMS: $XMS
        XMX: $XMX
    profiles:
      - bd
    <<: *common-talaxie-config

  postgres:
    # Extend official images with postgres-contrib
    image: postgres:latest-contrib
    build: db/postgres
    profiles:
      - postgres
    hostname: postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    labels:
        - traefik.enable=true
        - traefik.tcp.routers.postgres.rule=HostSNI(`*`)
        - traefik.tcp.routers.postgres.entrypoints=postgres
        - traefik.tcp.services.postgres.loadbalancer.server.port=$POSTGRES_TCP_PORT
    volumes:
      - postgresdata:/var/lib/postgresql
      # Volume with custom scripts to be run after database initialization
      - ./db/postgres/scripts:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    profiles:
      - postgres
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`$ADMINER_UI_DNS`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.routers.adminer.service=adminer
      - traefik.http.services.adminer.loadbalancer.server.port=$ADMINER_HTTP_PORT
      
volumes:
  postgresdata:
  talaxie_home:
  talaxie_configuration: